<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Aurum Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__header">
      <div class="admin-sidebar__logo">Aurum Studio Admin</div>
      <div class="admin-sidebar__role">Panel de Reservas</div>
    </div>
    <nav class="admin-nav">
      <a href="#" class="admin-nav__link active">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Agenda
      </a>
      <a href="index.html" class="admin-nav__link" style="margin-top:16px;color:rgba(255,255,255,.4)">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Volver al sitio
      </a>
    </nav>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <h1>Agenda de Reservas</h1>
      <div style="display:flex;align-items:center;gap:16px">
        <span style="font-size:.85rem;color:var(--color-muted)" id="todayDate"></span>
        <button onclick="cargarReservas()" style="background:none;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:6px 14px;font-size:.85rem;cursor:pointer;color:var(--color-muted)">↺ Actualizar</button>
      </div>
    </div>

    <div class="admin-content">
      <!-- Filtros -->
      <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
        <button class="filter-btn active" onclick="filtrar('todos',this)">Todos</button>
        <button class="filter-btn" onclick="filtrar('pendiente',this)">Pendientes</button>
        <button class="filter-btn" onclick="filtrar('confirmado',this)">Confirmados</button>
        <button class="filter-btn" onclick="filtrar('completado',this)">Completados</button>
        <button class="filter-btn" onclick="filtrar('cancelado',this)">Cancelados</button>
      </div>

      <!-- Tabla -->
      <div style="background:white;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden">
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Cliente</th>
                <th>Servicio</th>
                <th>Profesional</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="reservasTableBody">
              <tr><td colspan="7" style="text-align:center;color:var(--color-muted);padding:40px">Cargando reservas…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.filter-btn {
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--color-border);
  background: white;
  font-size: .85rem;
  cursor: pointer;
  color: var(--color-muted);
  font-weight: 500;
  transition: all .2s;
}
.filter-btn.active, .filter-btn:hover {
  background: var(--color-black);
  color: white;
  border-color: var(--color-black);
}

/* Kebab menu */
.kebab-btn {
  width: 30px; height: 30px;
  border-radius: 6px;
  border: 1px solid var(--color-border);
  background: white;
  font-size: 1.1rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--color-muted);
  transition: background .15s, color .15s;
  vertical-align: middle;
}
.kebab-btn:hover { background: var(--color-cream); color: var(--color-text); }
.kebab-menu {
  display: none;
  position: absolute;
  right: 0; top: 36px;
  background: white;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  min-width: 160px;
  z-index: 100;
  overflow: hidden;
}
.kebab-menu.open { display: block; }
.kebab-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 16px;
  font-size: .88rem;
  font-weight: 500;
  color: #e74c3c;
  background: none;
  border: none;
  cursor: pointer;
  transition: background .15s;
}
.kebab-menu button:hover { background: #fff5f5; }

/* Delete modal */
.delete-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(3px);
}
.delete-modal-overlay.open { display: flex; }
.delete-modal {
  background: white;
  border-radius: var(--radius-lg);
  padding: 40px 36px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  box-shadow: var(--shadow-lg);
  animation: modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn {
  from { transform: scale(.92); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.delete-modal__icon { font-size: 2.5rem; margin-bottom: 12px; }
.delete-modal h3 { font-size: 1.2rem; margin-bottom: 10px; }
.delete-modal p { color: var(--color-muted); font-size: .9rem; line-height: 1.6; margin-bottom: 28px; }
.delete-modal__actions { display: flex; gap: 12px; justify-content: center; }
.delete-modal__cancel {
  padding: 10px 24px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-pill);
  background: white;
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--color-muted);
  transition: all .2s;
}
.delete-modal__cancel:hover { border-color: var(--color-text); color: var(--color-text); }
.delete-modal__confirm {
  padding: 10px 24px;
  border: none;
  border-radius: var(--radius-pill);
  background: #e74c3c;
  color: white;
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s;
}
.delete-modal__confirm:hover { background: #c0392b; }
.delete-modal__confirm:disabled { opacity: .6; cursor: default; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/main.js"></script>
<script>
  const SB_URL = 'https://nelwxqhambuvqnbtyqid.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lbHd4cWhhbWJ1dnFuYnR5cWlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDQ1NTIsImV4cCI6MjA5NTg4MDU1Mn0.RhnAspgbvTkzIhNkl-jDQz6FfqhOmHpnoVR_zYna9Jw';
  const db = window.supabase.createClient(SB_URL, SB_KEY);

  const badgeMap = { pendiente:'badge-pending', confirmado:'badge-confirmed', completado:'badge-completed', cancelado:'badge-cancelled' };
  const badgeTxt = { pendiente:'Pendiente', confirmado:'Confirmado', completado:'Completado', cancelado:'Cancelado' };

  let todasReservas = [];
  let filtroActivo = 'todos';

  async function cargarReservas() {
    const tbody = document.getElementById('reservasTableBody');
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--color-muted);padding:40px">Cargando…</td></tr>';
    try {
      const { data, error } = await db.from('reservas').select('*').order('fecha', { ascending: false }).order('hora').limit(200);
      if (error) throw error;
      todasReservas = data;
      renderTabla();
    } catch(e) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#e74c3c;padding:40px">Error: ${e.message}</td></tr>`;
    }
  }

  function renderTabla() {
    const tbody = document.getElementById('reservasTableBody');
    const lista = filtroActivo === 'todos' ? todasReservas : todasReservas.filter(r => r.estado === filtroActivo);
    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--color-muted);padding:40px">No hay reservas</td></tr>';
      return;
    }
    tbody.innerHTML = lista.map(r => {
      const badge = badgeMap[r.estado] || 'badge-pending';
      const txt   = badgeTxt[r.estado] || r.estado;
      let acciones = '';
      if (r.estado === 'pendiente') {
        acciones = `<button onclick="cambiarEstado('${r.id}','confirmado',this)" style="color:var(--color-gold);font-size:.82rem;font-weight:600;background:none;border:none;cursor:pointer;margin-right:8px">✓ Confirmar</button>`;
      } else if (r.estado === 'confirmado') {
        acciones = `<button onclick="cambiarEstado('${r.id}','completado',this)" style="color:var(--color-success);font-size:.82rem;font-weight:600;background:none;border:none;cursor:pointer;margin-right:8px">✓ Completar</button>`;
      }
      if (r.estado !== 'cancelado' && r.estado !== 'completado') {
        acciones += `<button onclick="cambiarEstado('${r.id}','cancelado',this)" style="color:#e74c3c;font-size:.82rem;font-weight:600;background:none;border:none;cursor:pointer">✗ Cancelar</button>`;
      }
      return `<tr id="row-${r.id}">
        <td style="font-size:.85rem">${r.fecha}</td>
        <td><strong>${r.hora}</strong></td>
        <td>${r.nombre} ${r.apellido}<br><span style="font-size:.75rem;color:var(--color-muted)">${r.telefono}</span></td>
        <td>${r.servicio ? r.servicio.split(' + ').map(s => `<span style="display:inline-block;background:rgba(212,168,67,.1);border:1px solid rgba(212,168,67,.25);border-radius:4px;padding:2px 7px;font-size:.75rem;font-weight:600;margin:1px 2px;white-space:nowrap">${s}</span>`).join('') : '—'}</td>
        <td>${r.profesional || '—'}</td>
        <td><span class="badge ${badge}">${txt}</span></td>
        <td style="white-space:nowrap">
          ${acciones}
          <div class="kebab-wrap" style="display:inline-block;position:relative;margin-left:6px">
            <button class="kebab-btn" onclick="toggleKebab(this)" title="Más opciones">⋯</button>
            <div class="kebab-menu">
              <button onclick="confirmarBorrar('${r.id}','${r.nombre} ${r.apellido}')">🗑 Borrar reserva</button>
            </div>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  window.filtrar = function(estado, btn) {
    filtroActivo = estado;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTabla();
  };

  window.cambiarEstado = async function(id, nuevoEstado, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    const { error } = await db.from('reservas').update({ estado: nuevoEstado }).eq('id', id);
    if (error) { btn.disabled = false; btn.textContent = 'Error'; return; }
    const r = todasReservas.find(x => x.id === id);
    if (r) r.estado = nuevoEstado;
    renderTabla();
    if (window.showToast) window.showToast('Estado actualizado', 'success');
  };

  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('es-AR', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  cargarReservas();

  // ── Kebab menu ────────────────────────────────────────────
  window.toggleKebab = function(btn) {
    const menu = btn.nextElementSibling;
    const isOpen = menu.classList.contains('open');
    document.querySelectorAll('.kebab-menu.open').forEach(m => m.classList.remove('open'));
    if (!isOpen) menu.classList.add('open');
  };

  document.addEventListener('click', e => {
    if (!e.target.closest('.kebab-wrap')) {
      document.querySelectorAll('.kebab-menu.open').forEach(m => m.classList.remove('open'));
    }
  });

  // ── Confirm & delete ──────────────────────────────────────
  window.confirmarBorrar = function(id, nombre) {
    document.querySelectorAll('.kebab-menu.open').forEach(m => m.classList.remove('open'));
    const modal = document.getElementById('deleteModal');
    document.getElementById('deleteModalName').textContent = nombre;
    modal.dataset.targetId = id;
    modal.classList.add('open');
  };

  window.cerrarModal = function() {
    document.getElementById('deleteModal').classList.remove('open');
  };

  window.ejecutarBorrar = async function() {
    const modal = document.getElementById('deleteModal');
    const id = modal.dataset.targetId;
    const btn = document.getElementById('deleteConfirmBtn');
    btn.disabled = true;
    btn.textContent = 'Borrando…';
    const { error } = await db.from('reservas').delete().eq('id', id);
    if (error) {
      btn.disabled = false;
      btn.textContent = 'Sí, borrar';
      if (window.showToast) window.showToast('Error al borrar', 'error');
      return;
    }
    todasReservas = todasReservas.filter(r => r.id !== id);
    modal.classList.remove('open');
    btn.disabled = false;
    btn.textContent = 'Sí, borrar';
    renderTabla();
    if (window.showToast) window.showToast('Reserva eliminada', 'success');
  };
</script>

<!-- Modal de confirmación de borrado -->
<div id="deleteModal" class="delete-modal-overlay" onclick="if(event.target===this)cerrarModal()">
  <div class="delete-modal">
    <div class="delete-modal__icon">🗑</div>
    <h3>¿Borrar esta reserva?</h3>
    <p>Vas a eliminar permanentemente la reserva de <strong id="deleteModalName"></strong>. Esta acción no se puede deshacer.</p>
    <div class="delete-modal__actions">
      <button onclick="cerrarModal()" class="delete-modal__cancel">Cancelar</button>
      <button onclick="ejecutarBorrar()" id="deleteConfirmBtn" class="delete-modal__confirm">Sí, borrar</button>
    </div>
  </div>
</div>
</body>
</html>
